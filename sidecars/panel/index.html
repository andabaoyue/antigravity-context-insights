<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>上下文洞察</title>
  <link rel="stylesheet" href="/styles.css?v=2.1">
  <script src="/preload.js"></script>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-title">
        <svg class="svg-icon svg-icon-lg" width="18" height="18" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="9" rx="1"/>
          <rect x="14" y="3" width="7" height="5" rx="1"/>
          <rect x="14" y="12" width="7" height="9" rx="1"/>
          <rect x="3" y="16" width="7" height="5" rx="1"/>
        </svg>
        <span>上下文洞察</span>
      </div>
      <div class="header-actions">
        <div class="tab-group" id="rangeTabs">
          <button class="tab-btn" data-range="24h">近 24 小时</button>
          <button class="tab-btn" data-range="7d">近 7 天</button>
          <button class="tab-btn" data-range="30d">近 30 天</button>
          <button class="tab-btn active" data-range="all">全部</button>
        </div>
        <button class="icon-btn" id="btnRefresh" type="button" title="刷新数据 (Shift+点击重载)" aria-label="刷新数据">
          <svg class="svg-icon" width="14" height="14" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
            <polyline points="21 3 21 9 15 9"/>
          </svg>
        </button>
        <button class="icon-btn" id="btnClose" type="button" title="关闭面板 (Esc)" aria-label="关闭面板">
          <svg class="svg-icon" width="14" height="14" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Top 6 KPI Cards -->
    <section class="kpi-grid">
      <div class="kpi-card">
        <span class="kpi-label">活跃会话</span>
        <span class="kpi-value" id="kpiActiveConvs">--</span>
        <span class="kpi-sub" id="kpiTotalConvs">共 -- 个</span>
      </div>
      <div class="kpi-card">
        <span class="kpi-label" id="kpiTokenLabel">累计上下文消耗</span>
        <span class="kpi-value" id="kpiTotalTokens">--</span>
        <span class="kpi-sub" id="kpiTurns">轮次 --</span>
        <span class="kpi-sub kpi-watermark-sub" id="kpiWatermarkSummary">峰值水位 -- · 压缩 -- 次</span>
      </div>
      <div class="kpi-card">
        <span class="kpi-label">API 等效估算</span>
        <span class="kpi-value" id="kpiCost">--</span>
        <span class="kpi-sub" id="kpiCostDetail">已覆盖 --</span>
      </div>
      <div class="kpi-card">
        <span class="kpi-label">缓存命中率</span>
        <span class="kpi-value" id="kpiCacheRate">--%</span>
        <span class="kpi-sub" id="kpiCacheTokens">已加速 --</span>
      </div>
      <div class="kpi-card">
        <span class="kpi-label">工具调用</span>
        <span class="kpi-value" id="kpiToolCalls">--</span>
        <span class="kpi-sub" id="kpiToolTime">工具执行 --</span>
        <span class="kpi-sub" id="kpiToolBreakdown">文件与命令 -- · 调度 --</span>
      </div>
      <div class="kpi-card">
        <span class="kpi-label">活跃时长</span>
        <span class="kpi-value" id="kpiDuration">--</span>
        <span class="kpi-sub" id="kpiSpeed">速率 -- tok/s</span>
        <span class="kpi-last-reply" id="kpiLastReply" title="最近一次模型回复的输出速率（不含工具调用与等待）">本次 -- tok/s</span>
      </div>
    </section>

    <!-- Charts Row -->
    <section class="charts-grid">
      <!-- 1. Daily Usage Bar Chart -->
      <div class="chart-card">
        <div class="chart-card-header">
          <span class="chart-title">近期用量趋势</span>
          <div class="chart-legend-row">
            <span class="chart-legend-item"><span class="legend-dot" style="background:var(--primary-color);"></span> Token</span>
            <span class="chart-legend-item"><span class="legend-dot" style="background:var(--success-color);"></span> 费用</span>
          </div>
        </div>
        <div class="bar-chart-peak" id="barChartPeakScale"></div>
        <div class="bar-chart-container" id="barChartContainer"></div>
      </div>

      <!-- 2. Token Breakdown Donut -->
      <div class="chart-card">
        <div class="chart-card-header">
          <span class="chart-title">Token 统计分布</span>
          <span class="badge" id="tokenTotalBadge">-- 总量</span>
        </div>
        <div class="donut-container">
          <div class="donut-svg-wrapper">
            <svg viewBox="0 0 100 100" id="donutTokenSvg" width="130" height="130"></svg>
            <div class="donut-center-text">
              <span class="donut-center-val" id="donutTokenCenter">--</span>
              <span class="donut-center-sub" id="donutSubLabel">总用量</span>
            </div>
          </div>
          <div class="legend-list" id="tokenLegendList"></div>
        </div>
        <div class="model-breakdown-section" id="modelBreakdownSection"></div>
      </div>

      <!-- 3. Time Breakdown Donut -->
      <div class="chart-card">
        <div class="chart-card-header">
          <span class="chart-title">耗时与调度统计</span>
          <span class="badge" id="timeSpeedBadge">-- tok/s</span>
        </div>
        <div class="donut-container">
          <div class="donut-svg-wrapper">
            <svg viewBox="0 0 100 100" id="donutTimeSvg" width="130" height="130"></svg>
            <div class="donut-center-text">
              <span class="donut-center-val" id="donutTimeCenter">--</span>
              <span class="donut-center-sub">活跃时长</span>
            </div>
          </div>
          <div class="legend-list" id="timeLegendList"></div>
        </div>
        <div class="time-breakdown-footer" id="timeBreakdownFooter"></div>
      </div>

      <!-- 4. Heatmap Grid -->
      <div class="chart-card">
        <div class="chart-card-header">
          <span class="chart-title">历史活跃度 (步数贡献)</span>
          <span class="badge" id="heatmapSummaryBadge">日常记录</span>
        </div>
        <div class="heatmap-container">
          <div class="heatmap-layout">
            <div class="heatmap-weekdays">
              <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
            </div>
            <div class="heatmap-main">
              <div class="heatmap-months" id="heatmapMonths"></div>
              <div class="heatmap-grid" id="heatmapGrid"></div>
            </div>
          </div>
        </div>
        <div class="heatmap-footer" id="heatmapFooter"></div>
      </div>
    </section>

    <!-- Conversations Detailed List -->
    <section class="conv-section">
      <div class="conv-header">
        <div class="conv-toolbar-top">
          <div class="conv-toolbar-left">
            <h3 class="conv-section-title">会话透视 (<span id="convCount">0</span>)</h3>
            <div class="type-filter-group" id="convTypeFilter">
              <button class="sort-btn active" data-type="all">全部 (<span id="countAllConvs">0</span>)</button>
              <button class="sort-btn" data-type="main">主会话 (<span id="countMainConvs">0</span>)</button>
              <button class="sort-btn" data-type="subagent">子代理 (<span id="countSubConvs">0</span>)</button>
            </div>
          </div>
          <div class="search-box-wrapper">
            <svg class="svg-icon search-icon" width="14" height="14" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" class="search-input" id="searchConv" placeholder="搜索会话标题、模型或 ID...">
            <button type="button" class="search-clear-btn" id="btnClearSearch" style="display:none;" title="清空搜索" aria-label="清空搜索">
              <svg class="svg-icon" width="14" height="14" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="conv-toolbar-bottom">
          <div class="sort-group" id="sortGroup">
            <button class="sort-btn active" data-sort="recent">最新更新</button>
            <button class="sort-btn" data-sort="tokens">Token 总用量</button>
            <button class="sort-btn" data-sort="peak">峰值水位</button>
            <button class="sort-btn" data-sort="steps">步数优先</button>
            <button class="sort-btn" data-sort="speed">速率优先</button>
          </div>
          <button class="date-filter-chip" id="dateFilterChip" type="button" style="display:none;" title="点击清除日期筛选"></button>
        </div>
      </div>
      <div class="conv-list" id="convListContainer"></div>
    </section>
  </div>

  <div id="floatingTooltip"></div>
  <script src="/app.js?v=2.2"></script>
</body>
</html>
